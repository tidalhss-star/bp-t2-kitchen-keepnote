        /* CSS Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg: #fbf9f6;
            --color-text-primary: #1c1c1c;
            --color-text-muted: #666666;
            --color-accent: #3a5a40;
            --color-border: #e2ded5;
            --font-serif: 'Noto Serif KR', serif;
            --font-sans: 'Work Sans', sans-serif;
            --font-display: 'Cinzel', serif;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text-primary);
            font-family: var(--font-sans);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.01em;
        }

        /* Layout & Structure */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* Header Navigation */
        header {
            border-bottom: 1px solid var(--color-border);
            position: sticky;
            top: 0;
            background-color: rgba(251, 249, 246, 0.95);
            backdrop-filter: blur(8px);
            z-index: 100;
        }

        .header-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 90px;
        }

        .v-head-3tjb {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .v-head-3tjb a {
            color: var(--color-text-primary);
            text-decoration: none;
        }

        .t-item-hzph-container {
            display: flex;
            gap: 40px;
            list-style: none;
        }

        .t-item-hzph-container a {
            font-family: var(--font-serif);
            font-size: 0.95rem;
            color: var(--color-text-muted);
            text-decoration: none;
            transition: color 0.3s ease;
            font-weight: 500;
        }

        .t-item-hzph-container a:hover,
        .t-item-hzph-container a.active {
            color: var(--color-accent);
        }

        /* Hamburger Menu (Mobile Only) */
        .hamburger-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 10px;
            z-index: 110;
        }

        .hamburger-btn span {
            display: block;
            width: 25px;
            height: 2px;
            background-color: var(--color-text-primary);
            margin: 5px 0;
            transition: 0.3s;
        }

        /* Overlay Menu */
        .m-side-02b7-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--color-bg);
            z-index: 105;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .m-side-02b7-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .m-side-02b7-overlay a {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            color: var(--color-text-primary);
            text-decoration: none;
        }

        /* Editorial Layout for About Page */
        .intro-hero {
            padding: 120px 0 80px 0;
            border-bottom: 1px solid var(--color-border);
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: start;
        }

        .hero-left h1 {
            font-family: var(--font-serif);
            font-size: 3.2rem;
            font-weight: 300;
            line-height: 1.25;
            color: var(--color-text-primary);
            margin-bottom: 40px;
        }

        .hero-left h1 span {
            display: block;
            font-family: var(--font-display);
            font-size: 1.1rem;
            color: var(--color-accent);
            letter-spacing: 0.2em;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .hero-right {
            padding-top: 20px;
        }

        .hero-right p {
            font-family: var(--font-serif);
            font-size: 1.15rem;
            color: var(--color-text-primary);
            line-height: 1.8;
            margin-bottom: 25px;
        }

        /* Editorial Body Content */
        .editorial-section {
            padding: 100px 0;
            border-bottom: 1px solid var(--color-border);
        }

        .section-grid {
            display: grid;
            grid-template-columns: 3fr 7fr;
            gap: 60px;
        }

        .section-meta {
            font-family: var(--font-display);
            font-size: 0.9rem;
            letter-spacing: 0.15em;
            color: var(--color-accent);
            text-transform: uppercase;
            position: sticky;
            top: 140px;
        }

        .section-content h2 {
            font-family: var(--font-serif);
            font-size: 2rem;
            font-weight: 400;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .section-content p {
            font-size: 1.05rem;
            color: var(--color-text-muted);
            margin-bottom: 24px;
            text-align: justify;
        }

        .section-content p strong {
            color: var(--color-text-primary);
        }

        /* Quote Block */
        .quote-block {
            margin: 40px 0;
            padding-left: 30px;
            border-left: 3px solid var(--color-accent);
        }

        .quote-block blockquote {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            font-style: italic;
            color: var(--color-text-primary);
            line-height: 1.6;
        }

        /* Footer */
        footer {
            background-color: #111111;
            color: #ffffff;
            padding: 80px 0;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 60px;
            margin-bottom: 60px;
        }

        .footer-brand h4 {
            font-family: var(--font-display);
            font-size: 1.3rem;
            letter-spacing: 0.1em;
            margin-bottom: 20px;
        }

        .footer-brand p {
            color: #888888;
            font-size: 0.9rem;
            max-width: 320px;
        }

        .footer-links h5 {
            font-family: var(--font-serif);
            font-size: 1rem;
            margin-bottom: 20px;
            font-weight: 500;
            color: #cccccc;
        }

        .footer-links ul {
            list-style: none;
        }

        .footer-links li {
            margin-bottom: 12px;
        }

        .footer-links a {
            color: #888888;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: #ffffff;
        }

        .footer-bottom {
            border-top: 1px solid #222222;
            padding-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #666666;
        }

        /* Responsive Design */
        @media (max-width: 991px) {
            .hero-grid {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .section-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .section-meta {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 24px;
            }

            .t-item-hzph-container {
                display: none;
            }

            .hamburger-btn {
                display: block;
            }

            .hero-left h1 {
                font-size: 2.4rem;
            }

            .footer-grid {
                grid-template-columns: 1fr;
                gap: 40px;
            }
        }
